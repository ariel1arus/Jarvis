services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: jarvis_user
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: jarvis_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - jarvis_postgres_data:/var/lib/postgresql/data

  postgres_test:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: jarvis_user
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: jarvis_test
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis_user -d jarvis_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  openclaw:
    build:
      context: ./docker/openclaw
      dockerfile: Dockerfile
    restart: unless-stopped
    # CPU-only — no GPU needed for Phase 7
    # Host port is loopback-only; container binds lan internally (--bind lan)
    ports:
      - "127.0.0.1:18789:18789"
    # .env.local is read by Next.js; docker-compose reads it here so the
    # OPENAI_API_KEY reaches the container without a separate secrets file.
    env_file:
      - .env.local
    environment:
      OPENCLAW_GATEWAY_PORT: 18789
      OPENCLAW_GATEWAY_TOKEN: jarvis-oclaw-2026
    volumes:
      - openclaw_data:/home/node/.openclaw
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:18789/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  jarvis_postgres_data:
    external: true
    name: ai-procjets_jarvis_postgres_data
  postgres_test_data:
  openclaw_data:
