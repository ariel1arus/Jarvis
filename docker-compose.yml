services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: jarvis_user
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: jarvis_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - jarvis_postgres_data:/var/lib/postgresql/data

  postgres_test:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: jarvis_user
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: jarvis_test
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis_user -d jarvis_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  openclaw:
    image: openclaw/openclaw:latest
    restart: unless-stopped
    # CPU-only — no GPU needed for Phase 7
    ports:
      - "127.0.0.1:18789:18789"
    environment:
      OPENCLAW_GATEWAY_PORT: 18789
      # OpenClaw uses this key for its own LLM reasoning
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - openclaw_data:/root/.openclaw
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:18789/v1/models || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  jarvis_postgres_data:
    external: true
    name: ai-procjets_jarvis_postgres_data
  postgres_test_data:
  openclaw_data:
